<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora PWA simples e funcional">
    <meta name="theme-color" content="#2196F3">
    <title>Calculadora PWA</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>Calculadora PWA</h1>
                <button class="menu-btn" id="menu-btn" aria-label="Abrir menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="status-bar">
                <span id="connection-status">Online</span>
            </div>
        </header>
        
        <!-- Menu lateral -->
        <div class="menu-overlay" id="menu-overlay"></div>
        <nav class="side-menu" id="side-menu">
            <div class="menu-header">
                <h3>Menu</h3>
                <button class="close-menu-btn" id="close-menu-btn" aria-label="Fechar menu">
                    <span></span>
                    <span></span>
                </button>
            </div>
            
            <ul class="menu-items">
                <li>
                    <button class="menu-item" id="install-menu-btn">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                        <span>Baixar App</span>
                        <span class="menu-badge" id="install-badge" style="display: none;">Novo</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" id="about-btn">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                        <span>Sobre</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" id="settings-btn">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                        </svg>
                        <span>Configurações</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" id="help-btn">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
                        </svg>
                        <span>Ajuda</span>
                    </button>
                </li>
            </ul>
            
            <div class="menu-footer">
                <div class="app-info">
                    <span class="app-version">v1.0.0</span>
                    <span class="app-status" id="app-status">Online</span>
                </div>
            </div>
        </nav>
        
        <main class="calculator-container">
            <div class="calculator">
                <div class="display">
                    <div class="previous-operand" id="previous-operand"></div>
                    <div class="current-operand" id="current-operand">0</div>
                </div>
                
                <div class="buttons">
                    <button class="btn btn-clear" data-action="clear">AC</button>
                    <button class="btn btn-delete" data-action="delete">DEL</button>
                    <button class="btn btn-operator" data-action="operator" data-value="%">%</button>
                    <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>
                    
                    <button class="btn btn-number" data-action="number" data-value="7">7</button>
                    <button class="btn btn-number" data-action="number" data-value="8">8</button>
                    <button class="btn btn-number" data-action="number" data-value="9">9</button>
                    <button class="btn btn-operator" data-action="operator" data-value="*">×</button>
                    
                    <button class="btn btn-number" data-action="number" data-value="4">4</button>
                    <button class="btn btn-number" data-action="number" data-value="5">5</button>
                    <button class="btn btn-number" data-action="number" data-value="6">6</button>
                    <button class="btn btn-operator" data-action="operator" data-value="-">-</button>
                    
                    <button class="btn btn-number" data-action="number" data-value="1">1</button>
                    <button class="btn btn-number" data-action="number" data-value="2">2</button>
                    <button class="btn btn-number" data-action="number" data-value="3">3</button>
                    <button class="btn btn-operator" data-action="operator" data-value="+">+</button>
                    
                    <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
                    <button class="btn btn-number" data-action="number" data-value=".">.</button>
                    <button class="btn btn-equals" data-action="equals">=</button>
                </div>
            </div>
        </main>
        
        <div class="install-prompt" id="install-prompt" style="display: none;">
            <p>Instale este app para uma melhor experiência!</p>
            <button id="install-btn" class="btn btn-install">Instalar</button>
            <button id="dismiss-btn" class="btn btn-dismiss">Agora não</button>
        </div>
    </div>
    
    <!-- Service Worker -->
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
