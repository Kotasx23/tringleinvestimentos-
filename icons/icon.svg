<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D2D2D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Calculator body -->
  <rect x="80" y="120" width="352" height="272" rx="20" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Screen -->
  <rect x="100" y="140" width="312" height="60" rx="10" fill="url(#screen)" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Display text -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="end">123</text>
  
  <!-- Buttons -->
  <g fill="#2D2D2D" stroke="#FFFFFF" stroke-width="2">
    <!-- Row 1 -->
    <rect x="100" y="220" width="70" height="50" rx="8"/>
    <rect x="180" y="220" width="70" height="50" rx="8"/>
    <rect x="260" y="220" width="70" height="50" rx="8"/>
    <rect x="340" y="220" width="70" height="50" rx="8"/>
    
    <!-- Row 2 -->
    <rect x="100" y="280" width="70" height="50" rx="8"/>
    <rect x="180" y="280" width="70" height="50" rx="8"/>
    <rect x="260" y="280" width="70" height="50" rx="8"/>
    <rect x="340" y="280" width="70" height="50" rx="8"/>
    
    <!-- Row 3 -->
    <rect x="100" y="340" width="70" height="50" rx="8"/>
    <rect x="180" y="340" width="70" height="50" rx="8"/>
    <rect x="260" y="340" width="70" height="50" rx="8"/>
    <rect x="340" y="340" width="70" height="50" rx="8"/>
  </g>
  
  <!-- Button labels -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">
    <!-- Row 1 -->
    <text x="135" y="250">7</text>
    <text x="215" y="250">8</text>
    <text x="295" y="250">9</text>
    <text x="375" y="250">÷</text>
    
    <!-- Row 2 -->
    <text x="135" y="310">4</text>
    <text x="215" y="310">5</text>
    <text x="295" y="310">6</text>
    <text x="375" y="310">×</text>
    
    <!-- Row 3 -->
    <text x="135" y="370">1</text>
    <text x="215" y="370">2</text>
    <text x="295" y="370">3</text>
    <text x="375" y="370">-</text>
  </g>
  
  <!-- Special buttons with different colors -->
  <rect x="100" y="400" width="150" height="50" rx="8" fill="#4CAF50" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="260" y="400" width="70" height="50" rx="8" fill="#FF9800" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="340" y="400" width="70" height="50" rx="8" fill="#FF9800" stroke="#FFFFFF" stroke-width="2"/>
  
  <text x="175" y="430" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">0</text>
  <text x="295" y="430" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">.</text>
  <text x="375" y="430" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">=</text>
</svg>